<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ZipAI 프로젝트 소개, Frontend·Backend 구현과 전체 메뉴 발표">
  <title>ZipAI 프로젝트 발표</title>
  <link rel="stylesheet" href="/static/css/presentation.css?v=20261014-1">
  <script defer src="/static/js/presentation-data.js?v=20261014-1"></script>
  <script defer src="/static/js/presentation-core.js?v=20261014-1"></script>
  <script defer src="/static/js/presentation-audio-manifest.js?v=20261014-1"></script>
  <script defer src="/static/js/presentation-audio.js?v=20261014-1"></script>
  <script defer src="/static/js/presentation.js?v=20261014-1"></script>
  <script defer src="/static/js/presentation-live.js?v=20261014-1"></script>
</head>
<body>
  <header class="presentation-header">
    <a class="presentation-brand" href="#cover" aria-label="발표 첫 화면">ZipAI<span>PROJECT PRESENTATION</span></a>
    <nav aria-label="발표 이동">
      <button type="button" data-jump="agenda">발표 목차</button>
      <button type="button" data-jump="demo">시연 메인</button>
      <button type="button" id="menuOpen" aria-expanded="false" aria-controls="menuDialog">전체 메뉴</button>
      <a href="/" target="_blank" rel="noopener noreferrer" data-live>실제 ZipAI</a>
      <button type="button" id="fullScreen" aria-label="전체 화면 전환">전체 화면</button>
    </nav>
  </header>
  <main id="slideViewport" aria-label="발표 장표"><section id="slide" tabindex="-1" aria-labelledby="slideTitle"></section></main>
  <footer class="presentation-controls">
    <div class="slide-controls"><button type="button" id="prev">← 이전</button><span id="counter" aria-live="polite"></span><button type="button" id="next">다음 →</button></div>
    <div class="voice-controls" role="group" aria-label="장표 설명 음성">
      <button type="button" id="play" aria-label="현재 장표 음성 설명 재생">음성으로 설명</button>
      <button type="button" id="pause" disabled>일시정지</button>
      <button type="button" id="mute" aria-pressed="false">음소거</button>
      <button type="button" id="settingsOpen" aria-expanded="false" aria-controls="settings">음성 설정·대본</button>
    </div>
    <div class="tour-controls" id="tourControls" hidden>
      <span id="tourStatus" role="status"></span>
      <button type="button" id="tourPause">시연 일시정지</button>
      <button type="button" id="tourStop">자동 시연 종료</button>
    </div>
    <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
    <small style="grid-column:1/-1;text-align:right;font-size:11px">Voice generated with <a href="https://typecast.ai" target="_blank" rel="noopener noreferrer">Typecast</a></small>
  </footer>
  <p id="voiceStatus" role="status" class="voice-status">음성 설명은 버튼을 누르면 시작됩니다.</p>
  <aside id="settings" class="settings" hidden aria-label="음성 설정과 설명 대본">
    <div class="panel-heading"><h2>음성 설정·대본</h2><button type="button" id="settingsClose">닫기</button></div>
    <p class="settings-note">사만다 공통 음성 파일을 우선 재생합니다. 파일이 없거나 실패하면 기기의 한국어 음성을 사용합니다. 목소리 선택은 기기 음성에 적용됩니다.</p>
    <label>한국어 목소리<select id="voiceSelect" aria-label="한국어 목소리 선택"></select></label>
    <label>읽기 속도<select id="rate"><option value="0.85">천천히</option><option value="0.95" selected>보통</option><option value="1.1">빠르게</option></select></label>
    <label class="check"><input type="checkbox" id="follow" checked> 장표를 넘기면 새 설명 재생</label>
    <label class="check"><input type="checkbox" id="autoNext"> 설명이 끝나면 다음 장표로 이동</label>
    <h3>현재 장표 설명</h3><p id="scriptText" class="script-text"></p>
  </aside>
  <dialog id="menuDialog" aria-labelledby="menuTitle">
    <div class="panel-heading"><h2 id="menuTitle">전체 메뉴 바로가기</h2><button type="button" id="menuClose">닫기</button></div>
    <div id="menuContent" class="menu-index"></div>
  </dialog>
  <noscript><p class="noscript">장표 이동과 음성 설명에는 JavaScript가 필요합니다. 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
</body>
</html>
